# DRAFT (需法务审阅): CLA bot for the PUBLIC repository. Not active in the private monorepo
# (it is copied out by scripts/open-source-export.mjs). Uses the well-known contributor-assistant action.
# Required setup, no values in this file:
#   - secret GITHUB_TOKEN        provided automatically by GitHub Actions
#   - secret CLA_SIGNATURES_PAT  fine-grained PAT, only needed if signatures live in a DIFFERENT repo
#                                or on a protected branch (contents: read/write on that one repo)
# Signatures are stored in the file below on the `cla-signatures` branch (create it empty; keep it unprotected,
# or give the PAT bypass rights). See docs/open-source-ci.md.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Only run for the sign phrase, the recheck phrase, and PR events.
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write tokens: this job must NEVER check out or execute PR code.
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only used when signatures are stored outside this repo / on a protected branch; otherwise GITHUB_TOKEN suffices.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_PAT }}
        with:
          path-to-document: 'https://github.com/TODO-ORG/TODO-REPO/blob/main/CLA.md' # TODO: Jay sets org/repo name
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          # remote-organization-name / remote-repository-name: set only if signatures go to a separate repo.
          lock-pullrequest-aftermerge: false
