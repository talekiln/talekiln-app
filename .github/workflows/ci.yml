name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan
      # spec 报告器会在末尾单独列出失败用例和错误；TAP 输出夹在几万行迁移日志里，日志尾部看不到失败的是谁
      - run: pnpm test
        env:
          NODE_OPTIONS: --test-reporter=spec
      - run: pnpm build
      - run: pnpm --filter @talekiln/admin build

  # 云服务：同一套测试跑在真实 PostgreSQL 上（服务容器需要 Linux runner）。
  # 下面的库口令仅用于该一次性服务容器，不是任何真实环境的凭据。
  cloud-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway-db
          POSTGRES_DB: talekiln_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d talekiln_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-throwaway-db@localhost:5432/talekiln_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @talekiln/cloud prisma:generate
      - run: pnpm --filter @talekiln/cloud prisma:deploy
      - run: pnpm --filter @talekiln/cloud exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm --filter @talekiln/cloud test:pg

  package:
    needs: test
    # 私有仓库的 Actions 分钟有限（Windows 计 2 倍、macOS 计 10 倍）。安装包只在 main、手动触发和非草稿 PR 上构建；
    # 草稿 PR 每次推送只跑测试。2026-10-02 一天内 Actions 分钟被用光，所有作业 3 秒内无日志失败。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # 渲染核心 lycore 与 ffmpeg（LGPL，固定哈希）随安装包内置：resources/lycore/
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
        working-directory: packages/core
      - run: node scripts/fetch-ffmpeg.mjs

      # 签名骨架：只有存在证书 Secrets 且不是 PR 时才签名；否则走未签名构建。
      # 机密只经 env 传给下面单个步骤，不 echo、不落盘。见 docs/release-signing.md
      - name: Detect signing secrets
        id: signing
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.WIN_CSC_LINK != '' && secrets.WIN_CSC_KEY_PASSWORD != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if ($env:HAS_CERT -eq 'true' -and $env:EVENT -ne 'pull_request') { "enabled=true" >> $env:GITHUB_OUTPUT }
          else { "enabled=false" >> $env:GITHUB_OUTPUT }

      - name: Build installer (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: pnpm dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build installer (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify signature and update publisher
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "bad signature on $($_.Name): $($sig.Status)" }
            if (-not $sig.TimeStamperCertificate) { throw "no timestamp on $($_.Name)" }
          }
          $yml = Get-ChildItem -Recurse apps/desktop/release -Filter app-update.yml | Select-Object -First 1
          if (-not $yml -or -not (Select-String -Path $yml.FullName -Pattern '^publisherName:' -Quiet)) {
            throw 'app-update.yml has no publisherName: auto-update would skip signature verification'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: talekiln-win-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'UNSIGNED' }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # macOS 构建（P2-F）。未签名为默认；有 Apple 证书 Secrets 且不是 PR 时才签名并公证。见 docs/phase2-macos.md。
  # 选择：arm64（macos-14）为主——Apple 芯片是现役 Mac 的主体，且原生模块（better-sqlite3、sharp）按同架构构建最稳；
  # x64（Intel）作为实验项并行跑（continue-on-error），首次验证后再决定是否出 universal 或保留双包。
  # runner 标签随 GitHub 调整（Intel 镜像尤其会下线），改标签前先查 GitHub 当前文档。整个作业从未在真实 runner 上跑过。
  package-macos:
    needs: test
    # macOS runner 每分钟计 10 分钟：只在 main、手动触发或带 ci:macos 标签的 PR 上跑
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14, experimental: false }
          - { arch: x64, runner: macos-15-intel, experimental: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:scan
      - run: pnpm test:scripts
      - run: pnpm build

      # 签名 / 公证骨架：只有存在证书 Secrets 且不是 PR 时才签名；否则走未签名构建。
      # Secret 只经 env 传给需要它的单个步骤，不 echo、不落盘。
      # MAC_CSC_LINK = Developer ID Application 证书（.p12）的 base64；MAC_CSC_KEY_PASSWORD = 其口令；
      # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID = 公证用（App 专用口令，不是 Apple ID 登录密码）。
      - name: Detect signing secrets
        id: signing
        env:
          HAS_CERT: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$EVENT" != "pull_request" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_NOTARY" = "true" ] && [ "$EVENT" != "pull_request" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else echo "notarize=false" >> "$GITHUB_OUTPUT"; fi

      - uses: dtolnay/rust-toolchain@stable
      # 在真实 macOS 上跑 lycore 的 Rust 单测与 Node 集成测试（Unix 套接字、SIGTERM、父进程消失、编码器检测夹具）
      - name: lycore tests (cargo + node client)
        run: pnpm --filter @talekiln/core test
      # 桌面主进程的平台逻辑测试（参数注入平台，本来不依赖 macOS，这里顺带在 mac 上再跑一遍）
      - run: pnpm --filter @talekiln/desktop test
      # 全量测试先不作为门槛：其余包从未在 macOS 上跑过，第一轮结果用来摸底，稳定后去掉 continue-on-error
      - name: all package tests (informational for now)
        continue-on-error: true
        run: pnpm test

      - run: cargo build --release
        working-directory: packages/core

      # ffmpeg：固定清单里 macOS 条目仍是 TODO 时该步骤失败（退出码 3），作业继续，产物名带 NOFFMPEG，包内没有 ffmpeg。
      - name: Fetch ffmpeg (LGPL, pinned hash)
        id: ffmpeg
        continue-on-error: true
        run: node scripts/fetch-ffmpeg.mjs

      # 未签名构建：arm64 上完全无签名的 Mach-O 不能运行，所以对内置可执行文件做 ad-hoc 签名（不是身份签名，不能分发给公众）
      - name: Ad-hoc sign bundled executables (unsigned build only)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          codesign --force --sign - packages/core/target/release/lycore
          for f in apps/desktop/resources/ffmpeg/ffmpeg apps/desktop/resources/ffmpeg/ffprobe; do
            if [ -f "$f" ]; then codesign --force --sign - "$f"; fi
          done

      - name: Build app (signed, notarized)
        if: steps.signing.outputs.enabled == 'true' && steps.signing.outputs.notarize == 'true'
        run: node scripts/pack-desktop.mjs --mac --${{ matrix.arch }} -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build app (signed, not notarized)
        if: steps.signing.outputs.enabled == 'true' && steps.signing.outputs.notarize != 'true'
        run: node scripts/pack-desktop.mjs --mac --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Build app (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: node scripts/pack-desktop.mjs --mac --${{ matrix.arch }} -c.mac.identity=null
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify signature, Gatekeeper and notarization ticket
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          app=$(ls -d apps/desktop/release/mac*/Talekiln.app | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Authority|TeamIdentifier|flags=.*runtime"
          if [ "$NOTARIZED" = "true" ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: talekiln-mac-${{ matrix.arch }}-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'UNSIGNED' }}${{ steps.ffmpeg.outcome == 'success' && '' || '-NOFFMPEG' }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
