<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>举报入口 — {{siteName}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="style.css">
</head>
<body>
{{{header}}}
<main>
  <section class="section">
    <div class="wrap narrow">
      <h1 class="h1-small">举报入口</h1>
      <p class="notice">占位页面：举报渠道（表单或邮箱）、处理流程与时限须由运营与法务确认后填写。</p>
      <p>如发现违法违规或侵权内容，请通过以下方式联系：{{contact}}。</p>
      <p class="muted">部署时把配置里的 <code>reportUrl</code> 指向正式的举报页面即可，本占位页可删除。</p>
    </div>
  </section>
</main>
{{{footer}}}
</body>
</html>
